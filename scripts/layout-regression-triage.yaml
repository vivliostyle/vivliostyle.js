- id: "0071"
  category: General
  title: "calc()/clamp()/unitless font size in a footnote (Issue #2174 follow-up)"
  file: font-size-calc-values.html
  type: difference
  decision: expected  # regression / expected / skip
  notes: >-
    Follow-up of Issue #2174. stable renders the pre-fix result: a font-size that
    is not a size keyword (`calc()`, `clamp()`, a unitless zero, a negative
    `calc()` that the non-negative range of `font-size` clamps to zero, a
    `calc()` with a signed term, a math function embedded in an arithmetic
    expression, or a keyword substituted from a custom property) is not resolved to a length, so the em values of the footnote fall
    back to 16px (letter-spacing 32px) and differ from the inline reference of
    each paragraph. A source parent whose font size is a math function that the
    engine does not evaluate, e.g. `round(20px, 7px)` (21px), is not resolved
    either, so the relative `font-size: 2em` of the footnote is resolved in the
    footnote area: it is 32px in canary instead of the 42px of the inline
    reference. The step of a `round()` can be negative: the pre-fix viewers
    leave the value to the browser, which computes the 7px of the upper
    multiple of the interval but resolves the `letter-spacing: 2em` of the
    footnote against the 16px of the footnote area (32px instead of the
    reference's 14px), while the PR branch evaluates the function itself (the
    division by the negative step gave the -0 that was materialized as a zero
    size before this round) and matches the reference.
