- id: "0078"
  category: General
  title: "Invalid font sizes from a var() substitution (Issue #2174 follow-up)"
  file: invalid-var-font-size.html
  type: difference
  decision: expected  # regression / expected / skip
  notes: >-
    Follow-up of Issue #2174. stable and canary render the pre-fix result: the
    invalid `font-size: var(--invalid)` (5) of the footnote is not inherited but
    applied, so the footnote has no font size and its `letter-spacing: 2em` is
    32px instead of the 64px of the reference paragraph, the invalid
    `font-size: var(--negative)` (-10px) of a detached footnote makes it
    `font-size: -10px`, which the browser clamps to 0, so its
    `letter-spacing: 2em` is -20px, the substituted dimension without a unit
    size (`--unit: 5s`) is converted to `NaNpx`, so that footnote has no font
    size at all, and the invalid
    `font-size: var(--negative)` (-10px) of the root element makes the width of
    the blue 10rem box drop (it becomes the full page width) instead of the
    160px of the green reference box. A var() substitution is not revalidated,
    so the browser rejects such a declaration and keeps the font size that the
    element would inherit; the PR branch renders the "Wide" footnotes like the
    reference (31.998px, letter-spacing 64px) and the root keeps the initial
    16px (10rem = 160px). The unknown `font-size: nonsense` footnote and the
    `font-size: calc(10px - 20px)` footnote are 0 or inherited in both viewers,
    because an unknown keyword is rejected during parsing and a computed
    negative value is clamped instead; they guard the walk. The same
    `font-size: calc(10px - 20px)` in the normal flow is rendered as 0px in
    both viewers, because Chromium clamps the negative calc(), but stable and
    canary emit the negative length itself: a browser that rejects it (e.g.
    WebKit, where the layout unit adjustment is zero and the emitted value is
    the literal `-10px`) answers by inheriting the parent font size.
  approvedViewer: git-fix-issue2174  # viewer spec: git-<branch>, v2.35.0, canary, stable, URL...
  actualLabel: git-fix-issue2174
  actualUrl: >-
    https://vivliostyle-git-fix-issue2174-vivliostyle.vercel.app/#src=https://raw.githubusercontent.com/vivliostyle/vivliostyle.js/fix/issue2174/packages/core/test/files/invalid-var-font-size.html&zoom=1&spread=false
  baselineLabel: stable
  baselineUrl: >-
    https://vivliostyle.org/viewer/#src=https://raw.githubusercontent.com/vivliostyle/vivliostyle.js/fix/issue2174/packages/core/test/files/invalid-var-font-size.html&zoom=1&spread=false
  diffPages:
    - 1
- id: "0079"
  category: General
  title: "Root font size with a negative calc() (Issue #2174 follow-up)"
  file: font-size-root-negative-calc.html
  type: difference
  decision: expected  # regression / expected / skip
  notes: >-
    Follow-up of Issue #2174. stable and canary render the pre-fix result: the
    root font size is not resolved from the math function, so the width of the
    red 1rem box is dropped and it becomes as wide as the page (377.951px)
    instead of the 16px of the green box. A math function that computes a
    negative value is valid, so it is clamped to the zero of the non-negative
    `font-size` range instead: the PR branch renders the red box with no width.
    See invalid-var-font-size.html for the invalid literal, which does not apply
    at all.
