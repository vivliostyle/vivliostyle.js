- id: "0085"
  category: General
  title: "Font weight from a math function (Issue #2174 follow-up)"
  file: font-weight-math-function.html
  type: difference
  decision: expected  # regression / expected / skip
  notes: >-
    Follow-up of Issue #2174. canary renders the pre-fix result: the weight of
    the `min(900, 1000)` paragraph is preserved by the validator but never
    evaluated, so the value is unresolved when a detached element resolves
    `bolder` against it — the footnote "B" of that paragraph is 700, while the
    inline reference "B" of the same paragraph is 900. The PR branch evaluates
    number valued math functions like `calc()` and resolves the relative
    keyword against the result, so the footnote is 900 as well, and it clamps
    the result of a function like `max(1000, 1200)` to 1000 (canary and the PR
    branch agree on the clamps and on the invalid `min(900px, 1em)`, whose
    footnote keeps the inherited 700). The paragraph with
    `font-weight: round(650, 100)` is 700 in both, but the relative keyword
    `bolder` of its footnote resolves against the fallback 400 in canary (700)
    and against the 700 of the paragraph in the PR branch (900), like the
    inline reference; the engine evaluates the math functions of CSS
    Values 4 (`round()`, `mod()`, `abs()`, …), so their results are available
    as the basis of a relative keyword. A calculation that overflows to an
    infinity, e.g. `exp(1000)`, is the 1000 that the range of CSS Fonts 4
    clamps it to; canary leaves it unresolved, so the footnote "B" of that
    paragraph resolves `bolder` against the fallback 400 and is 700, while the
    inline references of the paragraph are 1000 and the PR branch renders the
    footnotes 1000 as well.
