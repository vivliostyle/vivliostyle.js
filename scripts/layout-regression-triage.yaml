  file: defaulting-keyword-from-var.html
  type: difference
  decision: expected  # regression / expected / skip
  notes: >-
    Follow-up of Issue #2174. stable and canary render the pre-fix result: a
    CSS-wide keyword that comes from a custom property is not canonicalized, so
    `--x: INHERIT; color: var(--x)` is not recognized as `inherit`. The
    declaration blocks the inherited value of the source parent, so the
    footnote "Red" is rendered in the color of the page (black) instead of the
    red of its source parent, and the "Wide" footnotes with
    `--y: INHERIT; font-size: var(--y)` use the initial 16px instead of the 32px
    of the source parent (`letter-spacing: 2em` is 32px instead of 64px). The
    PR branch compares the keyword names case insensitively, so the footnotes
    inherit the source parent values. The two "Bold" footnotes, whose rollback
    keyword comes from a `var()` fallback, are 700 in every viewer (the keyword
    becomes the whole value of the declaration, which rolls back to the UA
    weight of the `strong`), so they carry no difference; a CSS-wide keyword
    written directly as the value of a custom property is a known limitation of
    this engine (the browsers apply it to the custom property itself, so the
    reference is invalid at computed-value time and the property keeps the
    inherited value — measured 400 for a `strong` of a paragraph at 400, while
    every viewer of this test renders the UA weight 700).
