  title: "font-size: inherit with a region rule (Issue #2174 follow-up)"
  file: font-size-inherit-region-rule.html
  type: difference
  decision: expected  # regression / expected / skip
  notes: >-
    Follow-up of Issue #2174. stable renders the pre-fix result: the inline
    `font-size: inherit` of the footnote is compared with the region rule
    `:footnote-content { font-size: 0.9em }` as if the declaration of the
    source parent were a declaration of the element, so the region rule wins
    and the footnote is 18px instead of the inherited 20px. The PR branch
    materializes `inherit` — and `unset`, which behaves the same for an
    inherited property — with the priority of its own declaration, so the
    inline declaration wins and the footnotes are rendered like the browser
    renders them in the flow.
