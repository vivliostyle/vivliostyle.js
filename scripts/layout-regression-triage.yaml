  type: difference
  decision: expected  # regression / expected / skip
  notes: >-
    Follow-up of Issue #2174. stable and canary render the pre-fix result: a
    font weight that a var() substitution makes invalid is not revalidated, so
    the invalid number replaces the inherited 700 of the page. The footnote
    whose own weight is `var(--z)` (`0`) is emitted with that number, and the
    relative keyword of the other footnote is resolved against it, so the
