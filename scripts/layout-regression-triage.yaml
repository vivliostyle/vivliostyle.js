- id: "0076"
  category: General
  title: "lh unit of a detached font-size (Issue #2174 follow-up)"
  file: font-size-lh-unit-in-footnote.html
  type: difference
  decision: expected  # regression / expected / skip
  notes: >-
    Follow-up of Issue #2174. stable renders the pre-fix result: the `lh` unit
    of a `font-size` declared in a footnote is resolved against the root line
    height (20px) instead of the 40px line height of the source parent, so the
    letter-spacing of the footnote is 40px instead of the 80px of the inline
    reference (also when the line height is computed, e.g.
    `calc(2 * 20px)` or `calc(150%)`). The line height of an ancestor can be an
    `lh` unit itself, e.g. `line-height: 1lh` on the source parent of a
    footnote: it resolved to the 30px line height of its own parent, and the
    footnote that resolves `1lh` against it fell back to the 20px of the root
    instead of the 60px letter-spacing of the inline reference. A line height
    that is a math function, e.g. `min(40px, 2em)`, was not reduced either: the
    footnote that resolves `1lh` against it used the 20px of the root line
    height (letter-spacing 40px) instead of the 32px of the math function
    (letter-spacing 64px). An own line height of a detached element that is a
    math function with `lh`, e.g. `line-height: max(1lh, 5px)` on the footnote,
    was not resolved either: the footnote had the 20px of the preferred line
    height instead of the 40px of its source parent. The PR branch resolves
    those ancestor values level by level, reduces the math functions of an
    inherited line height to px, replaces the `lh` unit of such a value with the
    line height that the element inherits, and resolves the lh unit against the
    source parent, like content in the normal flow.
  approvedViewer: git-fix-issue2174  # viewer spec: git-<branch>, v2.35.0, canary, stable, URL...
  actualLabel: git-fix-issue2174
  actualUrl: >-
    https://vivliostyle-git-fix-issue2174-vivliostyle.vercel.app/#src=https://raw.githubusercontent.com/vivliostyle/vivliostyle.js/fix/issue2174/packages/core/test/files/font-size-lh-unit-in-footnote.html&zoom=1&spread=false
