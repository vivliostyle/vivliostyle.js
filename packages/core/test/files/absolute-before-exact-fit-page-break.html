<!doctype html>
<!-- Test case for Issue #2298: an absolutely positioned box between a
     block-level box that ends exactly at the end of the page and a box that
     moves to the next page must stay on the page where it is.
     Expected: on page 1, the purple square is centered inside the pink
     square, and the blue box is on page 2. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Absolutely positioned box before an exact-fit page break</title>
    <style>
      @page { size: 600px 600px; margin: 0; }
      body { margin: 0; }
      .filler { height: 400px; background: orange; }
      .reference { margin-top: 100px; width: 100px; height: 100px; background: pink; }
      .target { position: absolute; top: 525px; left: 25px; width: 50px; height: 50px; background: purple; }
      .next { height: 300px; background: skyblue; }
    </style>
  </head>
  <body>
    <div class="filler"></div>
    <div class="reference"></div>
    <div class="target"></div>
    <div class="next"></div>
  </body>
</html>
