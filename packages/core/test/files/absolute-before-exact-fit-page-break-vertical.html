<!doctype html>
<!-- Test case for Issue #2298 (vertical writing mode): an absolutely
     positioned box between a block-level box that ends exactly at the end of
     the page and a box that moves to the next page must stay on the page
     where it is.
     Expected: on page 1, the purple square is centered inside the pink
     square, and the blue box is on page 2. -->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Absolutely positioned box before an exact-fit page break (vertical)</title>
    <style>
      @page { size: 600px 600px; margin: 0; }
      html { writing-mode: vertical-rl; }
      body { margin: 0; }
      .filler { width: 400px; background: orange; }
      .reference { margin-right: 100px; width: 100px; height: 100px; background: pink; }
      .target { position: absolute; top: 25px; right: 525px; width: 50px; height: 50px; background: purple; }
      .next { width: 300px; background: skyblue; }
    </style>
  </head>
  <body>
    <div class="filler"></div>
    <div class="reference"></div>
    <div class="target"></div>
    <div class="next"></div>
  </body>
</html>
