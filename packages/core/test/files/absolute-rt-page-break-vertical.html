<!DOCTYPE html>
<!-- Test case for Issue #2162: the final ruby base and its absolutely positioned rt must stay on page 1. -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Absolutely positioned rt at a page break (vertical)</title>
    <style>
      @page {
        size: 140px 140px;
        margin: 10px;
      }
      :root {
        writing-mode: vertical-rl;
        font-size: 20px;
        line-height: 30px;
        orphans: 1;
        widows: 1;
      }
      body,
      p {
        margin: 0;
      }
      p {
        inline-size: 100px;
      }
      .unit {
        display: inline-block;
        inline-size: 100px;
      }
      ruby {
        position: relative;
        display: inline;
        white-space: nowrap;
      }
      rt {
        position: absolute;
        display: flex;
        inset-block-end: 100%;
        inset-inline-start: 50%;
        transform: translateY(-50%);
        inline-size: 8px;
        block-size: 8px;
        border-radius: 50%;
        background: black;
        font-size: 0;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <p><span class="unit">あ</span><span class="unit">あ</span><span class="unit">あ</span><ruby>永<rt>﹅</rt></ruby><span class="unit">い</span><span class="unit">い</span><span class="unit">い</span><span class="unit">い</span></p>
  </body>
</html>
