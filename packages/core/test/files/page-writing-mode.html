<style>
  @page {
    writing-mode: vertical-rl;
    size: 400px 800px;
    margin-inline-start: 2%;
    margin-block-start: 8%;
    margin-inline-end: 6%;

    padding-inline-start: 2%;
    padding-block-start: 8%;
    padding-inline-end: 6%;

  }

    print-color-adjust: exact;
  }
  body {
    margin: 0;
    background: hotpink;
  }
