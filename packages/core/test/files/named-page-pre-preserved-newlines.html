<!DOCTYPE html>
<!-- Test case for Issue #2172 (review): page starting at preserved newlines before a span inside a named-page pre -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Named page pre continuation at preserved newlines (Issue #2172)</title>
    <style>
      @page {
        size: 300px;
        margin: 36px;
        @top-center {
          content: "DEFAULT";
        }
      }
      @page code {
        background: #def;
        @top-center {
          content: "CODE";
        }
      }
      pre {
        page: code;
        margin: 0;
        font-size: 14px;
        line-height: 20px;
      }
    </style>
  </head>
  <body>
    <pre><span>line 1</span>
