<!DOCTYPE html>
<!-- PR #2198: browser-only viewport units cannot be evaluated as page geometry. -->
<html lang="en"><meta charset="utf-8"><title>Browser viewport units in page descriptors</title><style>
@page {size:500px 400px;margin:30px;bleed:0;crop-offset:0;min-page-width:0px;min-page-height:0px;snap-width:0px;snap-height:0px;}
@page {
  @top-left {
    content: "Page header";
    padding: 20px;
    min-width: 20px;
    max-width: 60px;
    min-height: 15px;
    max-height: 30px;
    min-block-size: 18px;
    max-inline-size: 70px;
    border-top: 5px solid black;
    border-block-width: 6px;
    border-inline-width: 7px;
  }
  @bottom-left {
    content: "Substituted dimension constraints use defaults.";
  }
}
@page:first {margin:30px;padding:0;bleed:0;crop-offset:0;}

body {font:16px Arial;margin:0;}
</style><body><p>Page size: 500px by 400px.</p><p>Unsupported variable values use zero crop offset and bleed.</p></body></html>
