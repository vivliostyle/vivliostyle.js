<!DOCTYPE html>
<!-- Test case for Issue #2174 follow-up: a line height that is a math function
     computing below zero is valid, and the non-negative computed-value range of
     `line-height` clamps it to 0. `calc(1lh - 100px)` of a footnote inside a
     paragraph with a 40px line height is therefore 0, not -60: materializing
     `-60px` would make the browser reject the declaration and inherit the 40px
     instead of applying zero. The footnote "Zero" must be rendered with the
     0px line height of the inline reference, not with the 40px it inherits. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Negative computed line-height (Issue #2174 follow-up)</title>
  <style>
    @page { size: 140mm 100mm; margin: 10mm; }
    body { font-size: 16px; }
    .dep { line-height: 40px; }
    .dep .fn-negative {
      float: footnote;
      line-height: calc(1lh - 100px);
    }
    .ref-negative { line-height: calc(1lh - 100px); }
    ::footnote-marker { content: ""; }
  </style>
</head>
<body>
  <p class="dep">The footnote "Zero" below declares the same line height as the
    inline reference "Zero" of this paragraph (0px, the clamped result of
    `calc(1lh - 100px)` with the inherited 40px), not the inherited 40px:
    <span class="ref-negative">Zero</span></p>
  <p class="dep">The footnote "Zero" is the one at the page bottom:
    <span class="fn-negative">Zero</span></p>
</body>
</html>
