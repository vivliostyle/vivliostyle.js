<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Web font family on ::marker</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap");

      ol {
        font-size: 48px;
      }
      li::marker,
      .reference {
        font-family: "Archivo Black";
      }
    </style>
  </head>
  <body>
    <h1>Web font family on ::marker</h1>
    <ol>
      <li><span class="reference">1.</span> Marker and reference</li>
    </ol>
    <p>The marker and the reference “1.” should use the same font.</p>
  </body>
</html>
