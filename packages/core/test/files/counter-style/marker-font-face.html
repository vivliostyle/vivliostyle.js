<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Font family defined by @font-face on ::marker</title>
    <style>
      @font-face {
        font-family: "Archivo Black";
        src: url("../fonts/ArchivoBlack/archivo-black-subset.woff2")
          format("woff2");
      }

      ol {
        font-size: 48px;
      }
      li::marker,
      .reference {
        font-family: "Archivo Black";
      }
    </style>
  </head>
  <body>
    <h1>Font family defined by @font-face on ::marker</h1>
    <ol>
      <li><span class="reference">1.</span> Marker and reference</li>
    </ol>
    <p>The marker and the reference “1.” should use the same font.</p>
  </body>
</html>
