<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Root metrics after a script-loaded font</title>
    <style>
      @font-face {
        font-family: ScriptMetric;
        src: url(fonts/ArchivoBlack/archivo-black-subset.woff2);
      }
      @page {
        size: calc(10rch + 500px) calc(10rcap + 500px);
        margin: 30px;
      }
      html {
        font-family: ScriptMetric;
        font-size: 40px;
      }
      body {
        font: 16px Arial;
      }
      .bar {
        height: 12px;
        margin: 8px 0;
        background: #297;
      }
      .plain {
        width: 20rch;
      }
      .calculated {
        width: calc(20rch + 1px);
      }
    </style>
  </head>
  <body>
    <p>The page and bars use metrics from the script-loaded root font.</p>
    <div class="bar plain"></div>
    <div class="bar calculated"></div>
  </body>
</html>
