<!doctype html>
<!-- Test case for Issue #2163: line fitting with inline elements and BR. -->
<html><head><meta charset="utf-8">
<title>Line fitting with inline elements and BR (vertical writing) (Issue #2163)</title>
<style>
@page { size: 84px 141px; margin: 10px }
:root { font: 20px/16px monospace; writing-mode: vertical-rl; }
body { margin: 0 }
p { margin: 0; orphans: 1; widows: 1; word-break: break-all; break-before: page }
</style></head>
<body>
<!-- Pages 1-2: plain text, four lines on each page. -->
<p>aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa</p>
<!-- Pages 3-4: an undecorated inline must not change the line count. -->
<p>aaaaaaaaaa<span>aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa</span>aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa</p>
<!-- Pages 5-6: BR must stay with the line it ends, with no extra blank line. -->
<p>aaaaaaaaaa<br>aaaaaaaaaa<br>aaaaaaaaaa<br>aaaaaaaaaa<br>aaaaaaaaaa<br>aaaaaaaaaa<br>aaaaaaaaaa<br>aaaaaaaaaa</p>
<!-- Pages 7-8: preserve intentional blank lines from consecutive BRs.
     Keep all three intentional blank lines, including across the page break. -->
<p>aaaaaaaaaa<br><br>aaaaaaaaaa<br><br>aaaaaaaaaa<br><br>aaaaaaaaaa</p>
</body></html>
