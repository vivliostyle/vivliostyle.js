<!DOCTYPE html>
<html>
  <head>
    <style>
      @namespace html url(http://www.w3.org/1999/xhtml);
      html {
        line-height: 1.25;
      }
      H1 {
        text-decoration: underline;
      }
      html|H1 {
        border: 1px solid blue;
      }
      #hamburg:is(H1) {
        color: red;
      }
      h1[ID="hamburg"] {
        background-color: purple;
      }
      h1[id="HAMBURG"] {
        background-color: green;
      }
      h1[hamburg="tokyo"] {
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <h1 id="hamburg" hamburg="TOKYO">
      This sentence should be written in red, underlined, have a purple
      background, 100% opacity and a 1px solid blue border.
    </h1>
  </body>
</html>
