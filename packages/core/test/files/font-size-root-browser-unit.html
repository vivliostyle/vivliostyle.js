<!DOCTYPE html>
<!-- Issue #2174 follow-up: root sizing and page units must use actual font
     metrics. Root font-size uses the initial font, while root line-height
     uses the computed root font. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Root font size from a browser resolved unit (Issue #2174 follow-up)</title>
  <style>
    @page { size: 800px 700px; margin: 10mm; }
    :root { font-family: "Courier New"; font-size: 5ch; line-height: 5ch; }
    body { margin: 0; font-family: Arial; font-size: 16px; line-height: normal; }
    .rem { width: 5rem; height: 10px; background: #333; }
    .native { font: initial; width: 25ch; height: 10px; background: #999; }
    .lh-ch, .lh-lh { font-family: "Courier New"; font-size: 1rem; }
    .lh-ch { line-height: 5ch; }
    .lh-lh { line-height: 1rlh; }
  </style>
</head>
<body>
  <p>The bars must have the same width: 5rem uses the root's 5ch of the initial
    font, while the reference uses 25ch of that initial font directly.</p>
  <div class="rem"></div>
  <div class="native"></div>
  <p>The paragraphs must have the same height: 5ch of the root's Courier New
    font and the computed root line height, 1rlh.</p>
  <p class="lh-ch">One line</p>
  <p class="lh-lh">One line</p>
</body>
</html>
