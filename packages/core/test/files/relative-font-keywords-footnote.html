<!DOCTYPE html>
<!-- Test case for Issue #2174: relative font keywords in detached content (footnote) must
     be resolved to numeric computed values against the inherited values. The em unit of
     `letter-spacing` must use the inherited font-size when the parent's font-size is the
     relative keyword `smaller`, and `font-weight: bolder` must be resolved against the
     inherited weight (700 in a bold paragraph), not against the footnote area's weight.
     The footnote texts must match the reference paragraphs below. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Relative font keywords in a footnote (Issue #2174)</title>
  <style>
    @page { size: 160mm 100mm; margin: 10mm; }
    p.small { font-size: smaller; } /* 16px / 1.2 = 13.333px */
    .fn { float: footnote; letter-spacing: 2em; } /* 13.333px x 2 = 26.667px */
    /* Reference: the same text with numeric values (13.333px and 26.667px) */
    p.ref { font-size: 13.3333px; letter-spacing: 26.6667px; }
    p.bold { font-weight: bold; } /* 700 */
    .fn2 { float: footnote; font-weight: bolder; } /* 700 -> 900 */
    p.wref { font-weight: 900; }
    ::footnote-marker { content: ""; }
  </style>
</head>
<body>
  <p class="small">Text with a footnote call<span class="fn">Wide letters</span>.</p>
  <p class="ref">Wide letters</p>
  <p class="bold">Bold text with a footnote call<span class="fn2">Weight test</span>.</p>
  <p class="wref">Weight test</p>
  <p>The two lines "Wide letters" above should have exactly the same width, and the
    two lines "Weight test" should have the same font weight (900).</p>
</body>
</html>
