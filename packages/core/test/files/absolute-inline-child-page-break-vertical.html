<!DOCTYPE html>
<!-- Test case for Issue #2162: an absolutely positioned span must stay with its inline containing block on page 1. -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Absolutely positioned span in an inline element at a page break (vertical)</title>
    <style>
      @page {
        size: 140px 140px;
        margin: 10px;
      }
      :root {
        writing-mode: vertical-rl;
        font-size: 20px;
        line-height: 30px;
        orphans: 1;
        widows: 1;
      }
      body,
      p {
        margin: 0;
      }
      p {
        inline-size: 100px;
      }
      .unit {
        display: inline-block;
        inline-size: 100px;
      }
      .anchor {
        position: relative;
        display: inline;
        white-space: nowrap;
      }
      .annotation {
        position: absolute;
        display: flex;
        inset-block-end: 100%;
        inset-inline-start: 50%;
        transform: translateY(-50%);
        inline-size: 8px;
        block-size: 8px;
        border-radius: 50%;
        background: black;
        font-size: 0;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <p><span class="unit">あ</span><span class="unit">あ</span><span class="unit">あ</span><span class="anchor">永<span class="annotation">﹅</span></span><span class="unit">い</span><span class="unit">い</span><span class="unit">い</span><span class="unit">い</span></p>
  </body>
</html>
